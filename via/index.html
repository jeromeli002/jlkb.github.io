content:center}.guide-step-list{margin:20px 0;list-style:none;padding:0}.guide-step-item{display:flex;gap:15px;margin-bottom:15px;align-items:flex-start}.step-badge{background:#f0f0f0;color:#da532c;font-weight:700;width:32px;height:32px;border-radius:50%;display:flex;justify-content:center;align-items:center;flex-shrink:0;font-size:18px}.step-text{color:#444;font-size:16px;line-height:1.6;font-family:Inter,'Fira Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}.guide-footer-btn{width:100%;background:#da532c;color:#fff;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;transition:background .2s}.guide-footer-btn:hover{background:#b84323}#guide-fab{position:fixed;bottom:25px;right:25px;width:46px;height:46px;background:#da532c;color:#fff;border-radius:50%;border:none;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;z-index:999;display:flex;justify-content:center;align-items:center;font-size:20px;transition:all .3s ease}#guide-fab:hover{transform:scale(1.05);background:#b84323}.no-scroll{overflow:hidden!important;padding-right:var(--scrollbar-width,0)}</style><script type="module" crossorigin src="./assets/index-ed274a0d.js"></script><link rel="modulepreload" crossorigin href="./assets/vendor-e44bd8ca.js"><link rel="stylesheet" href="./assets/index-c4b24582.css"></head><body><div id="root"></div><button id="guide-fab" onclick="openGuide()" title="帮助说明"><span>?</span></button><div id="guide-overlay" onclick="closeGuide(event)"><div class="guide-card" onclick="event.stopPropagation()"><h2>欢迎使用 VIA 👋</h2><div class="guide-step-list"><div class="guide-step-item"><div class="step-badge">1</div><div class="step-text">使用 USB 线连接您的键盘。</div></div><div class="guide-step-item"><div class="step-badge">2</div><div class="step-text">点击 <b>"Authorize Device"</b> 选择您的键盘。</div></div><div class="guide-step-item"><div class="step-badge">3</div><div class="step-text">加载成功后，点击选择或双击按键实时修改映射关系。</div></div><div class="guide-step-item"><div class="step-badge">4</div><div class="step-text">可以点击最上面菜单来切换界面语言。</div></div></div><div style="background:#fff8f0;padding:12px;border-radius:8px;font-size:16px;color:#856404;border:1px solid #ffeeba;margin-bottom:20px">💡 <b>提示：</b>如果无法识别，请在 Settings 开启 "Show Design tab" 并上传 json（联系卖家获取json）。</div><button class="guide-footer-btn" onclick="closeGuide()">我知道了</button></div></div><noscript>You need to enable JavaScript to run this app.</noscript><script>const STORAGE_KEY = 'via_user_has_onboarded';
    const overlay = document.getElementById('guide-overlay');

    // 计算滚动条宽度并设置 CSS 变量（防止页面抖动）
    function getScrollbarWidth() {
      return window.innerWidth - document.documentElement.clientWidth;
    }

    // 页面加载完成后检查状态
    window.addEventListener('DOMContentLoaded', () => {
      // 设置滚动条宽度变量
      document.documentElement.style.setProperty('--scrollbar-width', getScrollbarWidth() + 'px');
      
      const hasOnboarded = localStorage.getItem(STORAGE_KEY);
      if (!hasOnboarded) {
        openGuide();
      }
    });

    // 打开引导
    function openGuide() {
      overlay.style.display = 'flex';
      document.body.classList.add('no-scroll');
    }

    // 关闭引导
    function closeGuide(e) {
      overlay.style.display = 'none';
      document.body.classList.remove('no-scroll');
      localStorage.setItem(STORAGE_KEY, 'true');
    }

    // Esc 键关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.style.display === 'flex') {
        closeGuide();
      }
    });</script></body></html>
