<!doctype html>
<html lang="zh">
    <head>
        <meta charset="utf-8">
        <title>DXF编辑器</title>
        <!-- 彻底移除 <base> -->
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="icon" type="image/x-icon" href="favicon.ico">

        <style>
            @font-face {
                font-family: 'Material Symbols Outlined';
                font-style: normal;
                font-weight: 100 300;
                src: url('./fonts/font.woff2') format('woff2');
            }
            .material-symbols-outlined {
                font-family: 'Material Symbols Outlined';
                font-weight: normal;
                font-style: normal;
                font-size: 24px;
                line-height: 1;
                letter-spacing: normal;
                text-transform: none;
                display: inline-block;
                white-space: nowrap;
                word-wrap: normal;
                direction: ltr;
                -webkit-font-feature-settings: 'liga';
                -webkit-font-smoothing: antialiased;
            }

            :root {
                --cursor: url('./assets/cursor.svg') 64 64, crosshair;
                /* 其他变量... */
            }

            /* 关键：将光标应用到 body */
            body {
                margin: 0;
                overflow-x: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                font-size: 11px;
                -webkit-tap-highlight-color: transparent;
                cursor: var(--cursor);   /* 添加这一行 */
            }
            /* 其他样式 ... */
        </style>

        <link rel="stylesheet" href="./styles.css" media="print" onload="this.media='all'">
        <noscript>
            <link rel="stylesheet" href="./styles.css">
        </noscript>
    </head>
    <body>
        <app-root></app-root>
        <script>
            if (!crypto.randomUUID) crypto.randomUUID = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => (c === 'x' ? Math.random()*16|0 : Math.random()*4+8|0).toString(16));
        </script>
        <script src="./runtime.js" type="module"></script>
        <script src="./polyfills.js" type="module"></script>
        <script src="./main.js" type="module"></script>
    </body>
</html>
