<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ 敬请期待 ✨</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* ===== Canvas 粒子背景 ===== */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 1000px;
            width: 100%;
            animation: fadeInUp 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 发光徽标 ===== */
        .badge {
            display: inline-block;
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: pulseBadge 3s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        /* ===== 主标题 ===== */
        .main-title {
            font-size: clamp(3.2rem, 15vw, 7.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 40%, #4facfe 80%, #43e97b 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease-in-out infinite alternate;
            text-shadow: none;
            letter-spacing: 0.04em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            position: relative;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* 主标题后方光晕 */
        .main-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 40%, #4facfe 80%, #43e97b 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(40px);
            opacity: 0.3;
            animation: gradientShift 5s ease-in-out infinite alternate;
            z-index: -1;
            transform: scale(1.02);
        }

        /* ===== 副标题 ===== */
        .sub-title {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            letter-spacing: 6px;
            margin-top: 0.2rem;
            margin-bottom: 2.8rem;
            text-shadow: 0 0 40px rgba(79, 172, 254, 0.15);
        }

        .sub-title span {
            display: inline-block;
            animation: shimmer 2.8s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== 北京时间时钟（高精度，秒与厘秒分离） ===== */
        .clock-wrapper {
            margin-bottom: 2.8rem;
        }

        .clock-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            font-weight: 300;
        }

        .clock-display {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .clock-item {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 0.6rem 1.2rem;
            min-width: 80px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .clock-item:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
        }

        /* 厘秒卡片单独加一点强调 */
        .clock-item--cs {
            border-color: rgba(79, 172, 254, 0.15);
            background: rgba(79, 172, 254, 0.05);
        }
        .clock-item--cs .clock-number {
            background: linear-gradient(180deg, #4facfe 30%, #43e97b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .clock-number {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-variant-numeric: tabular-nums;
        }

        .clock-unit {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
            font-weight: 400;
        }

        .clock-date {
            margin-top: 1.2rem;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 3px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 按钮 ===== */
        .action-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.4rem;
        }

        .btn {
            padding: 0.8rem 2.6rem;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            color: #fff;
            box-shadow: 0 8px 40px rgba(245, 87, 108, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 60px rgba(245, 87, 108, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* ===== 社交链接 ===== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: all 0.4s ease;
            font-size: 1.1rem;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        /* ===== 浮动光晕装饰 ===== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb--1 {
            width: 400px;
            height: 400px;
            top: -120px;
            right: -100px;
            background: rgba(245, 87, 108, 0.15);
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        .glow-orb--2 {
            width: 350px;
            height: 350px;
            bottom: -80px;
            left: -80px;
            background: rgba(79, 172, 254, 0.12);
            animation: floatOrb 15s ease-in-out infinite alternate-reverse;
        }

        .glow-orb--3 {
            width: 200px;
            height: 200px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(240, 147, 251, 0.08);
            animation: floatOrb 10s ease-in-out infinite alternate;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -40px) scale(1.2);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .clock-display {
                gap: 0.5rem;
            }
            .clock-item {
                min-width: 60px;
                padding: 0.4rem 0.6rem;
            }
            .clock-number {
                font-size: 1.8rem;
            }
            .badge {
                font-size: 0.65rem;
                padding: 0.3rem 1.2rem;
            }
            .btn {
                padding: 0.6rem 1.8rem;
                font-size: 0.85rem;
            }
            .social-links a {
                width: 38px;
                height: 38px;
                font-size: 0.95rem;
            }
            .clock-date {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 450px) {
            .clock-item {
                min-width: 45px;
                padding: 0.3rem 0.4rem;
            }
            .clock-number {
                font-size: 1.3rem;
            }
            .clock-unit {
                font-size: 0.5rem;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 光晕装饰 ===== -->
    <div class="glow-orb glow-orb--1"></div>
    <div class="glow-orb glow-orb--2"></div>
    <div class="glow-orb glow-orb--3"></div>

    <!-- ===== 粒子画布 ===== -->
    <canvas id="particleCanvas"></canvas>

    <!-- ===== 主内容 ===== -->
    <div class="container">

        <!-- 徽标 -->
        <div class="badge">🚀 即将启程</div>

        <!-- 主标题 -->
        <h1 class="main-title" data-text="✨ 敬请期待 ✨">✨ 敬请期待 ✨</h1>

        <!-- 副标题 -->
        <p class="sub-title">
            <span>一</span><span>场</span><span>全</span><span>新</span><span>的</span><span>体</span><span>验</span>
            <span style="margin:0 6px;">·</span>
            <span>正</span><span>在</span><span>酝</span><span>酿</span>
        </p>

        <!-- ===== 北京时间时钟（秒与厘秒分离） ===== -->
        <div class="clock-wrapper">
            <div class="clock-label">⏰ 北京时间 · 工具精度</div>
            <div class="clock-display" id="beijingClock">
                <div class="clock-item">
                    <div class="clock-number" id="clockHours">00</div>
                    <div class="clock-unit">时</div>
                </div>
                <div class="clock-item">
                    <div class="clock-number" id="clockMinutes">00</div>
                    <div class="clock-unit">分</div>
                </div>
                <div class="clock-item">
                    <div class="clock-number" id="clockSeconds">00</div>
                    <div class="clock-unit">秒</div>
                </div>
                <div class="clock-item clock-item--cs">
                    <div class="clock-number" id="clockCentiseconds">00</div>
                    <div class="clock-unit">厘秒</div>
                </div>
            </div>
            <div class="clock-date" id="clockDate">----年--月--日</div>
        </div>

        <!-- 按钮 -->
        <div class="action-group">
            <button class="btn btn-primary" id="notifyBtn">🔔 第一时间通知我</button>
            <button class="btn btn-outline" id="learnBtn">了解更多 →</button>
        </div>

        <!-- 社交 -->
        <div class="social-links">
            <a href="#" aria-label="Twitter">🐦</a>
            <a href="#" aria-label="GitHub">🐙</a>
            <a href="#" aria-label="YouTube">▶</a>
            <a href="#" aria-label="Discord">💬</a>
        </div>

    </div>

    <script>
        // ============================================================
        //  1. 粒子背景 (Canvas)
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 120;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2.2 + 0.6;
                    this.speedX = (Math.random() - 0.5) * 0.35;
                    this.speedY = (Math.random() - 0.5) * 0.35;
                    this.opacity = Math.random() * 0.5 + 0.15;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) {
                particles.push(new Particle());
            }

            function drawLines() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 130;
                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * 0.25;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update();
                    p.draw(); });
                drawLines();
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                resize();
                particles.forEach(p => {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                });
            });
        })();

        // ============================================================
        //  2. 北京时间实时时钟（秒与厘秒独立显示）
        // ============================================================
        (function initBeijingClock() {
            const hoursEl = document.getElementById('clockHours');
            const minutesEl = document.getElementById('clockMinutes');
            const secondsEl = document.getElementById('clockSeconds');
            const centisecondsEl = document.getElementById('clockCentiseconds');
            const dateEl = document.getElementById('clockDate');

            function pad2(num) {
                return String(num).padStart(2, '0');
            }

            function updateClock() {
                const now = new Date();

                // 计算北京时间 (UTC+8)
                const beijingTimestamp = now.getTime() + (8 * 60 * 60 * 1000);
                const bjDate = new Date(beijingTimestamp);

                // 提取时间组件
                const hours = pad2(bjDate.getUTCHours());
                const minutes = pad2(bjDate.getUTCMinutes());
                const seconds = pad2(bjDate.getUTCSeconds());
                // 厘秒 (百分位秒) 0-99
                const centiseconds = pad2(Math.floor(bjDate.getUTCMilliseconds() / 10));

                // 分别更新
                hoursEl.textContent = hours;
                minutesEl.textContent = minutes;
                secondsEl.textContent = seconds;
                centisecondsEl.textContent = centiseconds;

                // 格式化日期
                const year = bjDate.getUTCFullYear();
                const month = pad2(bjDate.getUTCMonth() + 1);
                const day = pad2(bjDate.getUTCDate());
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekday = weekdays[bjDate.getUTCDay()];

                dateEl.textContent = `${year}年${month}月${day}日 ${weekday}`;
            }

            updateClock();
            // 每 50ms 更新一次，让厘秒流畅跳动
            setInterval(updateClock, 50);
        })();

        // ============================================================
        //  3. 交互反馈
        // ============================================================
        document.getElementById('notifyBtn').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const original = btn.textContent;
            btn.textContent = '✅ 已订阅！';
            btn.style.background = 'linear-gradient(135deg, #43e97b, #38f9d7)';
            btn.style.boxShadow = '0 8px 40px rgba(67,233,123,0.4)';
            setTimeout(() => {
                btn.textContent = original;
                btn.style.background = '';
                btn.style.boxShadow = '';
            }, 2500);
        });

        document.getElementById('learnBtn').addEventListener('click', function() {
            alert('🌟 更多精彩内容正在筹备中，敬请保持关注！');
        });

        document.querySelectorAll('.social-links a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const label = this.textContent.trim();
                alert(`📢 即将开放 ${label} 官方账号，敬请期待！`);
            });
        });

        console.log('%c✨ 敬请期待 ✨', 'font-size:32px; font-weight:bold; color:#f5576c;');
        console.log('%c一场全新的体验，正在酝酿……', 'font-size:16px; color:#4facfe;');
    </script>
</body>
</html>
